# Inventory for the end-to-end test (container names resolve on the compose network).
all:
  vars:
    ansible_user: tester
    ansible_ssh_private_key_file: /work/tests/e2e/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3
  children:
    backup_server:
      hosts:
        server:
          ansible_host: server
    backup_clients:
      hosts:
        web1:
          ansible_host: web1
          backup_paths: [/etc, /srv/app]
          backup_excludes: ["/srv/app/cache"]
          backup_databases:
            - name: generated
              type: command
              command: "printf 'id,value\\n1,hello\\n2,world\\n'"
              filename: generated.csv
        db1:
          ansible_host: db1
          backup_interval_hours: 6
          backup_paths: [/etc/postgresql]
          backup_databases:
            - name: appdb
              type: postgres
              database: appdb
          backup_retention: { last: 3, daily: 7 }
