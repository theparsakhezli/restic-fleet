# End-to-end test fleet: one backup server, two clients, one Ansible controller.
x-node: &node
  build: { context: ., dockerfile: Dockerfile.node }
  image: restic-fleet-e2e-node
  privileged: true
  cgroup: host
  tmpfs: [/run, /run/lock, /tmp]
  volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
  networks: [fleet]

services:
  server: { <<: *node, hostname: server, container_name: rf-e2e-server }
  web1: { <<: *node, hostname: web1, container_name: rf-e2e-web1 }
  db1: { <<: *node, hostname: db1, container_name: rf-e2e-db1 }
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
      args: { ANSIBLE_CORE: "${ANSIBLE_CORE:-ansible-core>=2.16,<2.20}" }
    image: restic-fleet-e2e-controller
    container_name: rf-e2e-controller
    command: ["sleep", "infinity"]
    volumes: ["../..:/work"]
    environment:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_CONFIG: /work/ansible.cfg
      ANSIBLE_FORCE_COLOR: "1"
    networks: [fleet]

networks:
  fleet: {}
