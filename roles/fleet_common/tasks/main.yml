---
- name: Check the inventory layout
  ansible.builtin.assert:
    that:
      - groups[fleet_server_group] | default([]) | length == 1
      - groups[fleet_client_group] | default([]) | length >= 1
    fail_msg: >-
      The inventory needs exactly one host in '{{ fleet_server_group }}' and at least one
      in '{{ fleet_client_group }}'.
  run_once: true

# cache_valid_time judges the package index by the age of /var/lib/apt/lists. Images that wipe the
# lists (containers, many cloud/golden images) can leave it empty yet seconds old, so apt would
# skip the update and then find no packages at all. With no lists, always update.
- name: Check whether apt has package lists
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: ["*_Packages*"]
  register: _apt_lists
  when: ansible_facts.os_family == "Debian"

# Package mirrors fail now and then, so installs are retried. On hosts without python3-apt, Ansible
# installs it after a single `apt-get update` that exits 0 even when nothing could be downloaded;
# a retry runs that again instead of failing the whole deploy on one network hiccup.
- name: Install base packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ fleet_packages_debian }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 3600 if _apt_lists.matched > 0 else 0 }}"
  register: _base_packages
  retries: 3
  delay: 15
  until: _base_packages is succeeded
  when: ansible_facts.os_family == "Debian"

- name: Install base packages (RHEL family)
  ansible.builtin.dnf:
    name: "{{ fleet_packages_redhat }}"
    state: present
  register: _base_packages_rh
  retries: 3
  delay: 15
  until: _base_packages_rh is succeeded
  when: ansible_facts.os_family == "RedHat"
