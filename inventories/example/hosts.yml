# Example inventory. `./setup.sh` writes one of these for you; copy it by hand if you prefer:
#   cp -r inventories/example inventories/prod && $EDITOR inventories/prod/hosts.yml
all:
  vars:
    ansible_user: ubuntu            # an SSH user with sudo rights
  children:
    backup_server:                  # exactly one machine: stores the repositories + dashboard
      hosts:
        backup1:
          ansible_host: 203.0.113.10

    backup_clients:                 # every machine to back up (host names become repo names)
      hosts:
        web1:
          ansible_host: 203.0.113.21
          backup_paths:
            - /etc
            - /srv/app
          backup_excludes:
            - /srv/app/tmp
          backup_databases:
            - name: app-postgres    # PostgreSQL running in Docker
              type: postgres
              container: app-db
              database: app
              user: postgres

        db1:
          ansible_host: 203.0.113.22
          backup_schedule: "*-*-* 00/6:00:00"   # every 6 hours
          backup_interval_hours: 6
          backup_paths: [/etc]
          backup_databases:
            - name: shop            # MySQL/MariaDB in Docker (root password from the container env)
              type: mysql
              container: shop-mysql
              database: shop
            - name: pg-all          # native PostgreSQL, all databases (pg_dumpall)
              type: postgres
            - name: redis-rdb       # any command that writes to stdout
              type: command
              command: "cat /var/lib/redis/dump.rdb"
              filename: dump.rdb
          backup_retention: { daily: 14, weekly: 8, monthly: 12 }
